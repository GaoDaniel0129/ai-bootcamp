<!-- static/index.html：聊天测试页（极简，够用即可） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>流式聊天测试</title></head>
<body>
<h3>流式聊天（POST + SSE）</h3>
<input id="msg" placeholder="说点什么" style="width:300px">
<button onclick="send()">发送</button>
<pre id="out" style="border:1px solid #ccc;padding:10px;min-height:200px;white-space:pre-wrap"></pre>

<script>
let sessionId = "new";
const out = document.getElementById("out");

async function send() {
  const msg = document.getElementById("msg").value;
  if (!msg) return;
  out.textContent = "AI: ";
  const resp = await fetch("/chat/stream", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({message: msg, session_id: sessionId})
  });
  // 读 SSE 流
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += decoder.decode(value, {stream: true});
    // 按 \n\n 切事件
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const event = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      if (!event.startsWith("data: ")) continue;
      try {
        const data = JSON.parse(event.slice(6));
        if (data.delta) out.textContent += data.delta;   // 逐字追加
        if (data.done) { sessionId = data.session_id; }
      } catch(e) {}
    }
  }
}
</script>
</body>
</html>
